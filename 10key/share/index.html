<!-- The COPY LINK key on the itch.io page lands here (owner 2026-11-06: an itch description cannot run a copy button).
     It shares the itch.io demo link: copy, phone share sheet, X, Threads, then back to the game. -->
<body class="tk-page" data-small="share">
  <header class="site-header"><div class="tk-wrap header-inner">
    <a class="brand-lockup" href="/" aria-label="House Duck"><img class="brand-duck-image" src="/assets/house-duck-logo-96.webp" width="96" height="96" alt=""><img class="brand-wordmark-image" src="/assets/house-duck-wordmark-360.webp" width="360" height="84" alt="House Duck"></a>
  </div></header>
  <main class="tk-small" id="main-content">
    <div class="tk-card">
      <span class="tk-card-key" aria-hidden="true"><img src="/assets/media/home/page-key-1u_intact.webp" width="336" height="336" alt=""><img src="/assets/media/home/page-legend-5.webp" width="336" height="336" alt=""></span>
      <h1 data-share-t="title">Share 10key Survival</h1>
      <p data-share-t="intro">Copy the link to the free demo and send it to a friend.</p>
      <label class="tk-share-addr"><span class="tk-sr" data-share-t="addr">Link</span><input class="tk-input" data-share-addr type="text" readonly value="https://houseduck.itch.io/10key-survival"></label>
      <div class="tk-actions tk-share-keys">
        <button class="tk-key" type="button" data-share-copy><span class="tk-key-face" data-share-t="copy">Copy link</span></button>
        <button class="tk-key tk-key-ghost" type="button" data-share-phone hidden><span class="tk-key-face" data-share-t="phone">Phone share sheet</span></button>
        <a class="tk-key tk-key-ghost" data-share-x href="https://twitter.com/intent/tweet" target="_blank" rel="noopener"><span class="tk-key-face" data-share-t="x">Post on X</span></a>
        <a class="tk-key tk-key-ghost" data-share-threads href="https://www.threads.net/intent/post" target="_blank" rel="noopener"><span class="tk-key-face" data-share-t="threads">Post on Threads</span></a>
      </div>
      <p class="tk-store-note" role="status" aria-live="polite" data-share-status></p>
      <p class="tk-store-note"><a href="https://houseduck.itch.io/10key-survival" data-share-t="back">Back to the game</a></p>
    </div>
  </main>
  <footer class="tk-footer"><div class="tk-wrap tk-footer-inner"><ul class="tk-footer-links"><li><a href="/privacy/" data-href-ko="/privacy/ko.html#section-13" data-href-en="/privacy/en.html#section-13" data-ko="개인정보처리방침" data-en="Privacy policy">Privacy policy</a></li><li><a href="/support/" data-ko="고객지원" data-en="Support">Support</a></li></ul><small>© <span data-current-year>2026</span> House Duck</small></div></footer>
</body>
