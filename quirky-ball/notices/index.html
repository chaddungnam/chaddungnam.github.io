<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="Quirky Ball update notices from House Duck">
  <link href="/assets/site-fonts.css" rel="stylesheet">
  <title>Quirky Ball Updates — House Duck</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans", system-ui, sans-serif; color: #2c211b; background: #f8f4ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 8%, #ffd9a7 0, transparent 34%), #f8f4ec; }
    a { color: inherit; }
    header, main, footer { width: min(720px, calc(100% - 36px)); margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; min-height: 76px; gap: 20px; }
    .brand { font-weight: 900; letter-spacing: .08em; text-decoration: none; }
    select { border: 1px solid #d7c3af; border-radius: 999px; background: #fffaf3; padding: 8px 12px; color: inherit; }
    main { padding: clamp(34px, 8vw, 88px) 0 60px; }
    .kicker { margin: 0 0 14px; color: #d85832; font-size: .78rem; font-weight: 900; letter-spacing: .14em; }
    .notice-shell { border: 1px solid #ead6c1; border-radius: 28px; background: rgba(255,255,255,.86); padding: clamp(22px, 5vw, 42px); box-shadow: 0 18px 60px rgba(91,50,29,.1); }
    h1 { margin: 0; max-width: 15ch; font-size: clamp(2rem, 7vw, 3.5rem); line-height: .98; letter-spacing: -.045em; word-break: keep-all; }
    #notice-list { display: grid; gap: 12px; max-height: min(62vh, 620px); margin-top: 28px; overflow-y: auto; padding-right: 4px; }
    .notice-card { width: 100%; border: 2px solid #e6b178; border-radius: 18px; background: #fffaf3; color: inherit; padding: 18px; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .notice-card:hover, .notice-card:focus-visible { border-color: #e55d36; box-shadow: 0 8px 24px rgba(216,88,50,.15); outline: none; transform: translateY(-2px); }
    .notice-meta { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: #8b6e5d; font-size: .83rem; font-weight: 800; }
    .notice-kind { color: #d85832; letter-spacing: .08em; }
    .notice-card p { margin: 12px 0 0; font-size: 1.02rem; line-height: 1.55; white-space: pre-line; }
    #notice-detail[hidden], #notice-list[hidden], #notice-loading[hidden] { display: none; }
    .notice-loading { min-height: 180px; display: grid; place-content: center; gap: 12px; color: #8b6e5d; font-weight: 800; text-align: center; }
    .notice-spinner { width: 30px; height: 30px; margin-inline: auto; border: 3px solid #f1d9c0; border-top-color: #ea623c; border-radius: 50%; animation: spin .8s linear infinite; }
    #google_translate_element { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    #notice-detail time { display: block; margin: 20px 0 28px; color: #8b6e5d; font-weight: 700; }
    #notice-body { margin: 0; font-size: clamp(1.03rem, 2.5vw, 1.2rem); line-height: 1.85; white-space: pre-line; }
    .back { display: inline-flex; margin-top: 28px; border: 0; border-radius: 999px; background: #ea623c; color: white; padding: 13px 20px; font: inherit; font-weight: 900; text-decoration: none; cursor: pointer; }
    .error { color: #8b6e5d; }
    footer { padding: 0 0 36px; color: #8b6e5d; font-size: .84rem; }
    body.embedded { height: 100dvh; min-height: 0; overflow: hidden; background: #fff; }
    body.embedded header, body.embedded footer { display: none; }
    body.embedded main { width: 100%; height: 100%; padding: 8px 6px 8px 10px; overflow: hidden; }
    body.embedded .notice-shell { height: 100%; border: 0; border-radius: 0; box-shadow: none; background: #fff; padding: 0; overflow: hidden; }
    body.embedded .kicker, body.embedded h1 { display: none; }
    body.embedded #notice-list, body.embedded #notice-detail { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; scrollbar-width: auto; scrollbar-color: #d85832 #f5e8dc; }
    body.embedded #notice-list::-webkit-scrollbar, body.embedded #notice-detail::-webkit-scrollbar { width: 9px; }
    body.embedded #notice-list::-webkit-scrollbar-track, body.embedded #notice-detail::-webkit-scrollbar-track { border-radius: 999px; background: #f5e8dc; }
    body.embedded #notice-list::-webkit-scrollbar-thumb, body.embedded #notice-detail::-webkit-scrollbar-thumb { min-height: 34px; border: 2px solid #f5e8dc; border-radius: 999px; background: #d85832; }
    body.embedded #notice-list { align-content: start; grid-auto-rows: max-content; gap: 8px; max-height: none; margin-top: 0; padding: 0 3px 0 0; }
    body.embedded .notice-card { padding: 10px 12px; border-radius: 12px; background: #fff; }
    body.embedded .notice-meta { font-size: .74rem; }
    body.embedded .notice-card p { display: -webkit-box; margin: 4px 0 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 1; font-size: .94rem; line-height: 1.35; }
    body.embedded #notice-detail { padding: 4px 6px 12px 2px; }
    @media (prefers-reduced-motion: no-preference) { .notice-shell { animation: enter .45s ease-out both; } @keyframes enter { from { opacity: 0; transform: translateY(10px); } } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">HOUSE DUCK</a>
    <label><span hidden>Language</span><select id="language" aria-label="Language"></select></label>
  </header>
  <main>
    <p class="kicker">QUIRKY BALL · UPDATE</p>
    <section class="notice-shell" aria-live="polite">
      <h1 id="notice-title">공지사항</h1>
      <div id="notice-loading" class="notice-loading">
        <span class="notice-spinner" aria-hidden="true"></span>
        <span id="notice-loading-text">Loading</span>
      </div>
      <div id="notice-list" aria-label="Notices"></div>
      <section id="notice-detail" hidden>
        <time id="notice-date"></time>
        <p id="notice-body"></p>
        <button id="back-to-list" class="back" type="button">← 공지 목록</button>
      </section>
    </section>
  </main>
  <div id="google_translate_element" aria-hidden="true"></div>
  <footer>© 2026 House Duck. 작은 게임, 큰 개성.</footer>
  <script>
    const languageNames = { ko: "한국어", en: "English", de: "Deutsch", ja: "日本語", fr: "Français", es: "Español", it: "Italiano", zh_CN: "简体中文", zh_TW: "繁體中文", ar: "العربية", id: "Bahasa Indonesia", ur: "اردو" };
    const normalizeLanguage = (value) => ({ "zh-cn": "zh_CN", "zh-tw": "zh_TW", "zh-hans": "zh_CN", "zh-hant": "zh_TW" }[value.toLowerCase()] ?? value.split("-")[0]);
    const search = new URLSearchParams(location.search);
    const requestedParam = search.get("lang");
    const requested = requestedParam && requestedParam.trim() ? requestedParam : normalizeLanguage(navigator.language || "en");
    const selectedNoticeId = search.get("notice");
    if (search.has("embed")) document.body.classList.add("embedded");
    const endpoint = "https://bbgwvpwzkyudbtcgrbtm.supabase.co/functions/v1/public-notice";
    const fallbackManifestEndpoint = "/quirky-ball/notices/v1.json";
    const language = languageNames[requested] ? requested : "en";
    const googleLanguage = { zh_CN: "zh-CN", zh_TW: "zh-TW" }[language] ?? language;

    const list = document.querySelector("#notice-list");
    const loading = document.querySelector("#notice-loading");
    const detail = document.querySelector("#notice-detail");
    const date = document.querySelector("#notice-date");
    const body = document.querySelector("#notice-body");
    const select = document.querySelector("#language");
    const loadingText = document.querySelector("#notice-loading-text");
    let loadingDots = 1;
    let loadingTimer = null;
    for (const key of Object.keys(languageNames)) select.add(new Option(languageNames[key] ?? key, key));
    select.value = language;

    const renderLoading = () => {
      loadingText.textContent = `Loading${".".repeat(loadingDots)}`;
    };
    const startLoadingAnimation = () => {
      loadingDots = 1;
      renderLoading();
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = setInterval(() => {
        loadingDots = loadingDots % 3 + 1;
        renderLoading();
      }, 450);
    };
    const stopLoadingAnimation = () => {
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = null;
    };

    const renderChrome = (nextLanguage) => {
      document.documentElement.lang = "ko";
      document.documentElement.dir = ["ar", "ur"].includes(nextLanguage) ? "rtl" : "ltr";
      select.setAttribute("aria-label", "언어");
      document.title = "공지사항 — House Duck";
    };
    const waitForBrowserTranslation = () => new Promise((resolve) => {
      if (language === "ko") return resolve();
      const startedAt = Date.now();
      const check = () => document.documentElement.className.includes("translated-") || Date.now() - startedAt > 8000
        ? resolve()
        : setTimeout(check, 100);
      check();
    });
    const startBrowserTranslation = () => {
      if (language === "ko") return Promise.resolve();
      document.cookie = `googtrans=/ko/${googleLanguage};path=/;SameSite=Lax`;
      window.googleTranslateElementInit = () => {
        new google.translate.TranslateElement({ pageLanguage: "ko", includedLanguages: googleLanguage, autoDisplay: false }, "google_translate_element");
      };
      const script = document.createElement("script");
      script.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      script.onerror = () => document.documentElement.classList.add("translation-fallback");
      document.head.append(script);
      return waitForBrowserTranslation();
    };
    const translateText = async (text, targetLanguage) => {
      if (targetLanguage === "ko" || !text) return text;
      try {
        const target = encodeURIComponent(googleLanguage);
        const query = encodeURIComponent(text);
        const response = await fetch(`https://translate.google.com/translate_a/single?client=gtx&sl=ko&tl=${target}&dt=t&q=${query}`);
        if (!response.ok) return text;
        const translated = await response.json();
        const joined = Array.isArray(translated?.[0])
          ? translated[0].map((part) => part?.[0] ?? "").join("")
          : "";
        return joined || text;
      } catch (_error) {
        return text;
      }
    };
    const localizeKnownNotice = (notice, manifest, nextLanguage) => {
      const source = manifest?.locales?.ko;
      const translation = manifest?.locales?.[nextLanguage];
      if (String(notice.id) !== "3" || !source || !translation || notice.body.trim() !== source.body.trim()) return notice;
      return { ...notice, title: translation.title, body: translation.body };
    };
    const localizeNotice = async (notice, manifest, nextLanguage) => {
      const known = localizeKnownNotice(notice, manifest, nextLanguage);
      if (known !== notice || nextLanguage === "ko") return known;
      return {
        ...notice,
        title: await translateText(String(notice.title ?? "공지"), nextLanguage),
        body: await translateText(String(notice.body), nextLanguage),
      };
    };
    const renderDetail = (notice) => {
      document.querySelector("#back-to-list").hidden = false;
      date.hidden = false;
      date.textContent = notice.created_at.slice(0, 10);
      date.dateTime = notice.created_at;
      body.className = "";
      body.textContent = notice.body;
      list.hidden = true;
      loading.hidden = true;
      detail.hidden = false;
    };
    const loadNotices = async (nextLanguage) => {
      renderChrome(nextLanguage);
      startLoadingAnimation();
      loading.hidden = false;
      list.hidden = true;
      detail.hidden = true;
      try {
        const [response, manifestResponse] = await Promise.all([
          fetch(endpoint, { cache: "no-store" }),
          fetch(fallbackManifestEndpoint, { cache: "force-cache" }).catch(() => null),
        ]);
        if (!response.ok) throw new Error("notice_unavailable");
        const data = await response.json();
        const manifest = manifestResponse?.ok ? await manifestResponse.json() : null;
        const notices = (Array.isArray(data.notices)
          ? data.notices.filter((notice) => notice?.body && notice?.created_at)
            .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())
          : []);
        if (!notices.length) throw new Error("notice_unavailable");
        const localizedNotices = await Promise.all(notices.map((notice) => localizeNotice(notice, manifest, nextLanguage)));
        list.replaceChildren(...localizedNotices.map((notice) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "notice-card";
            const meta = document.createElement("span");
            meta.className = "notice-meta";
            const kind = document.createElement("span");
            kind.className = "notice-kind";
            kind.textContent = "공지";
            const created = document.createElement("time");
            created.dateTime = notice.created_at;
            created.textContent = notice.created_at.slice(0, 10);
            meta.append(kind, created);
            const preview = document.createElement("p");
            preview.textContent = notice.body;
            card.append(meta, preview);
            card.addEventListener("click", () => renderDetail(notice));
            return card;
          }));
        if (localizedNotices.some((notice, index) => notice.body === notices[index].body)) {
          await startBrowserTranslation();
        }
        stopLoadingAnimation();
        loading.hidden = true;
        list.hidden = false;
        const selected = localizedNotices.find((notice) => String(notice.id) === selectedNoticeId);
        if (selected) renderDetail(selected);
      } catch (_error) {
        stopLoadingAnimation();
        loading.hidden = true;
        list.hidden = true;
        detail.hidden = false;
        date.hidden = true;
        document.querySelector("#back-to-list").hidden = true;
        body.textContent = "현재 이 공지를 불러올 수 없어요.";
        body.className = "error";
      }
    };
    select.addEventListener("change", () => {
      const url = new URL(location.href);
      url.searchParams.set("lang", select.value);
      location.replace(url);
    });
    document.querySelector("#back-to-list").addEventListener("click", () => {
      detail.hidden = true;
      list.hidden = false;
    });
    loadNotices(language);
  </script>
</body>
</html>
