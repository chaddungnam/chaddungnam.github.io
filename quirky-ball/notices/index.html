<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="Quirky Ball update notices from House Duck">
  <link href="/assets/site-fonts.css" rel="stylesheet">
  <title>Quirky Ball Updates — House Duck</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans", system-ui, sans-serif; color: #2c211b; background: #f8f4ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 8%, #ffd9a7 0, transparent 34%), #f8f4ec; }
    a { color: inherit; }
    header, main, footer { width: min(720px, calc(100% - 36px)); margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; min-height: 76px; gap: 20px; }
    .brand { font-weight: 900; letter-spacing: .08em; text-decoration: none; }
    select { border: 1px solid #d7c3af; border-radius: 999px; background: #fffaf3; padding: 8px 12px; color: inherit; }
    main { padding: clamp(34px, 8vw, 88px) 0 60px; }
    .kicker { margin: 0 0 14px; color: #d85832; font-size: .78rem; font-weight: 900; letter-spacing: .14em; }
    .notice-shell { border: 1px solid #ead6c1; border-radius: 28px; background: rgba(255,255,255,.86); padding: clamp(22px, 5vw, 42px); box-shadow: 0 18px 60px rgba(91,50,29,.1); }
    h1 { margin: 0; max-width: 15ch; font-size: clamp(2rem, 7vw, 3.5rem); line-height: .98; letter-spacing: -.045em; word-break: keep-all; }
    #notice-list { display: grid; gap: 12px; max-height: min(62vh, 620px); margin-top: 28px; overflow-y: auto; padding-right: 4px; }
    .notice-card { width: 100%; border: 2px solid #e6b178; border-radius: 18px; background: #fffaf3; color: inherit; padding: 18px; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .notice-card:hover, .notice-card:focus-visible { border-color: #e55d36; box-shadow: 0 8px 24px rgba(216,88,50,.15); outline: none; transform: translateY(-2px); }
    .notice-meta { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: #8b6e5d; font-size: .83rem; font-weight: 800; }
    .notice-kind { color: #d85832; letter-spacing: .08em; }
    .notice-card p { margin: 12px 0 0; font-size: 1.02rem; line-height: 1.55; white-space: pre-line; }
    #notice-detail[hidden], #notice-list[hidden] { display: none; }
    #notice-detail time { display: block; margin: 20px 0 28px; color: #8b6e5d; font-weight: 700; }
    #notice-body { margin: 0; font-size: clamp(1.03rem, 2.5vw, 1.2rem); line-height: 1.85; white-space: pre-line; }
    .back { display: inline-flex; margin-top: 28px; border: 0; border-radius: 999px; background: #ea623c; color: white; padding: 13px 20px; font: inherit; font-weight: 900; text-decoration: none; cursor: pointer; }
    .error { color: #8b6e5d; }
    footer { padding: 0 0 36px; color: #8b6e5d; font-size: .84rem; }
    body.embedded header, body.embedded footer { display: none; }
    body.embedded main { padding: 20px 0; }
    body.embedded .notice-shell { border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 0; }
    body.embedded .kicker, body.embedded h1 { display: none; }
    body.embedded #notice-list { margin-top: 0; }
    @media (prefers-reduced-motion: no-preference) { .notice-shell { animation: enter .45s ease-out both; } @keyframes enter { from { opacity: 0; transform: translateY(10px); } } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">HOUSE DUCK</a>
    <label><span hidden>Language</span><select id="language" aria-label="Language"></select></label>
  </header>
  <main>
    <p class="kicker">QUIRKY BALL · UPDATE</p>
    <section class="notice-shell" aria-live="polite">
      <h1 id="notice-title">Loading…</h1>
      <div id="notice-list" aria-label="Notices"></div>
      <section id="notice-detail" hidden>
        <time id="notice-date"></time>
        <p id="notice-body"></p>
        <button id="back-to-list" class="back" type="button">All notices</button>
      </section>
    </section>
  </main>
  <footer>© 2026 House Duck. Small games. Big personality.</footer>
  <script>
    const languageNames = { ko: "한국어", en: "English", de: "Deutsch", ja: "日本語", fr: "Français", es: "Español", it: "Italiano", zh_CN: "简体中文", zh_TW: "繁體中文", ar: "العربية", id: "Bahasa Indonesia", ur: "اردو" };
    const normalizeLanguage = (value) => ({ "zh-cn": "zh_CN", "zh-tw": "zh_TW", "zh-hans": "zh_CN", "zh-hant": "zh_TW" }[value.toLowerCase()] ?? value.split("-")[0]);
    const search = new URLSearchParams(location.search);
    const requested = search.get("lang") ?? normalizeLanguage(navigator.language || "en");
    const selectedNoticeId = search.get("notice");
    if (search.has("embed")) document.body.classList.add("embedded");
    const endpoint = "https://bbgwvpwzkyudbtcgrbtm.supabase.co/functions/v1/public-notice";
    const localizedCopy = {
      ko: { title: "공지사항", kicker: "QUIRKY BALL · 공지", kind: "공지", all: "전체 공지", unavailable: "현재 이 공지를 불러올 수 없어요.", language: "언어", footer: "작은 게임, 큰 개성." },
      en: { title: "Notices", kicker: "QUIRKY BALL · NOTICE", kind: "NOTICE", all: "All notices", unavailable: "This notice is temporarily unavailable.", language: "Language", footer: "Small games. Big personality." },
      de: { title: "Hinweise", kicker: "QUIRKY BALL · HINWEIS", kind: "HINWEIS", all: "Alle Hinweise", unavailable: "Dieser Hinweis ist vorübergehend nicht verfügbar.", language: "Sprache", footer: "Kleine Spiele. Große Persönlichkeit." },
      ja: { title: "お知らせ", kicker: "QUIRKY BALL · お知らせ", kind: "お知らせ", all: "すべてのお知らせ", unavailable: "現在このお知らせを表示できません。", language: "言語", footer: "小さなゲーム、大きな個性。" },
      fr: { title: "Annonces", kicker: "QUIRKY BALL · ANNONCE", kind: "ANNONCE", all: "Toutes les annonces", unavailable: "Cette annonce est temporairement indisponible.", language: "Langue", footer: "Petits jeux. Forte personnalité." },
      es: { title: "Avisos", kicker: "QUIRKY BALL · AVISO", kind: "AVISO", all: "Todos los avisos", unavailable: "Este aviso no está disponible temporalmente.", language: "Idioma", footer: "Juegos pequeños. Gran personalidad." },
      it: { title: "Avvisi", kicker: "QUIRKY BALL · AVVISO", kind: "AVVISO", all: "Tutti gli avvisi", unavailable: "Questo avviso non è al momento disponibile.", language: "Lingua", footer: "Piccoli giochi. Grande personalità." },
      zh_CN: { title: "公告", kicker: "QUIRKY BALL · 公告", kind: "公告", all: "全部公告", unavailable: "暂时无法查看此公告。", language: "语言", footer: "小游戏，大个性。" },
      zh_TW: { title: "公告", kicker: "QUIRKY BALL · 公告", kind: "公告", all: "全部公告", unavailable: "暫時無法查看此公告。", language: "語言", footer: "小遊戲，大個性。" },
      ar: { title: "الإعلانات", kicker: "QUIRKY BALL · إعلان", kind: "إعلان", all: "جميع الإعلانات", unavailable: "هذا الإعلان غير متاح مؤقتًا.", language: "اللغة", footer: "ألعاب صغيرة. شخصية كبيرة." },
      id: { title: "Pengumuman", kicker: "QUIRKY BALL · PENGUMUMAN", kind: "PENGUMUMAN", all: "Semua pengumuman", unavailable: "Pengumuman ini sementara tidak tersedia.", language: "Bahasa", footer: "Game kecil. Karakter besar." },
      ur: { title: "اعلانات", kicker: "QUIRKY BALL · اعلان", kind: "اعلان", all: "تمام اعلانات", unavailable: "یہ اعلان عارضی طور پر دستیاب نہیں۔", language: "زبان", footer: "چھوٹے کھیل، بڑی شخصیت۔" },
    };
    const localized = (language) => localizedCopy[language] ?? localizedCopy.en;
    const language = languageNames[requested] ? requested : "en";

    fetch(endpoint, { cache: "no-store" })
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((data) => {
        const notices = Array.isArray(data.notices)
          ? data.notices.filter((notice) => notice?.body && notice?.created_at)
            .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())
          : [];
        if (!notices.length) return Promise.reject();
        const list = document.querySelector("#notice-list");
        const detail = document.querySelector("#notice-detail");
        const date = document.querySelector("#notice-date");
        const body = document.querySelector("#notice-body");
        const renderDetail = (notice) => {
          date.textContent = notice.created_at.slice(0, 10);
          date.dateTime = notice.created_at;
          body.textContent = notice.body;
          list.hidden = true;
          detail.hidden = false;
        };
        const render = (nextLanguage) => {
          const copy = localized(nextLanguage);
          document.documentElement.lang = nextLanguage.replace("_", "-");
          document.documentElement.dir = ["ar", "ur"].includes(nextLanguage) ? "rtl" : "ltr";
          document.querySelector(".kicker").textContent = copy.kicker;
          document.querySelector("#notice-title").textContent = copy.title;
          document.querySelector("#back-to-list").textContent = copy.all;
          document.querySelector("#language").setAttribute("aria-label", copy.language);
          document.querySelector("footer").textContent = `© 2026 House Duck. ${copy.footer}`;
          list.replaceChildren(...notices.map((notice) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "notice-card";
            const meta = document.createElement("span");
            meta.className = "notice-meta";
            const kind = document.createElement("span");
            kind.className = "notice-kind";
            kind.textContent = copy.kind;
            const created = document.createElement("time");
            created.dateTime = notice.created_at;
            created.textContent = notice.created_at.slice(0, 10);
            meta.append(kind, created);
            const preview = document.createElement("p");
            preview.textContent = notice.body;
            card.append(meta, preview);
            card.addEventListener("click", () => renderDetail(notice));
            return card;
          }));
          document.title = `${copy.title} — House Duck`;
        };
        const select = document.querySelector("#language");
        for (const key of Object.keys(languageNames)) select.add(new Option(languageNames[key] ?? key, key));
        select.value = language;
        select.addEventListener("change", () => render(select.value));
        document.querySelector("#back-to-list").addEventListener("click", () => {
          detail.hidden = true;
          list.hidden = false;
        });
        render(language);
        const selected = notices.find((notice) => String(notice.id) === selectedNoticeId);
        if (selected) renderDetail(selected);
      })
      .catch(() => {
        const copy = localized(language);
        document.documentElement.lang = language.replace("_", "-");
        document.documentElement.dir = ["ar", "ur"].includes(language) ? "rtl" : "ltr";
        document.querySelector("#notice-title").textContent = copy.title;
        document.querySelector("#notice-list").hidden = true;
        document.querySelector("#notice-detail").hidden = false;
        document.querySelector("#notice-date").hidden = true;
        document.querySelector("#back-to-list").hidden = true;
        document.querySelector("#notice-body").textContent = copy.unavailable;
        document.querySelector("#notice-body").className = "error";
        document.querySelector("#language").setAttribute("aria-label", copy.language);
        document.querySelector("footer").textContent = `© 2026 House Duck. ${copy.footer}`;
      });
  </script>
</body>
</html>
