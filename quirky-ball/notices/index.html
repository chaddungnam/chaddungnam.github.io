<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="Quirky Ball update notices from House Duck">
  <link href="/assets/site-fonts.css" rel="stylesheet">
  <link href="content.css?v=20260906-1" rel="stylesheet">
  <link href="/assets/notice-links.css?v=20260909-1" rel="stylesheet">
  <title>Quirky Ball Updates — House Duck</title>
  <script>
    // Mark the embed mode on <html> before first paint: the body script runs only after the
    // external scripts load, so the full cream page chrome must never flash inside an app popup.
    (() => {
      const params = new URLSearchParams(location.search);
      if (!params.has("embed")) return;
      document.documentElement.classList.add("embedded");
      // Quirky Ball 2.0 draws the notice inside a dark popup: page surface must stay transparent.
      if (params.get("theme") === "dark") document.documentElement.classList.add("embed-dark");
    })();
  </script>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans", system-ui, sans-serif; color: #2c211b; background: #f8f4ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 8%, #ffd9a7 0, transparent 34%), #f8f4ec; }
    a { color: inherit; }
    header, main, footer { width: min(720px, calc(100% - 36px)); margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; min-height: 76px; gap: 20px; }
    .brand { font-weight: 900; letter-spacing: .08em; text-decoration: none; }
    select { border: 1px solid #d7c3af; border-radius: 999px; background: #fffaf3; padding: 8px 12px; color: inherit; }
    main { padding: clamp(34px, 8vw, 88px) 0 60px; }
    .kicker { margin: 0 0 14px; color: #d85832; font-size: .78rem; font-weight: 900; letter-spacing: .14em; }
    .notice-shell { border: 1px solid #ead6c1; border-radius: 28px; background: rgba(255,255,255,.86); padding: clamp(22px, 5vw, 42px); box-shadow: 0 18px 60px rgba(91,50,29,.1); }
    h1 { margin: 0; max-width: 15ch; font-size: clamp(2rem, 7vw, 3.5rem); line-height: .98; letter-spacing: -.045em; word-break: keep-all; }
    #notice-list { display: grid; gap: 12px; max-height: min(62vh, 620px); margin-top: 28px; overflow-y: auto; padding-right: 4px; }
    .notice-card { width: 100%; border: 2px solid #e6b178; border-radius: 18px; background: #fffaf3; color: inherit; padding: 18px; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .notice-card:hover, .notice-card:focus-visible { border-color: #e55d36; box-shadow: 0 8px 24px rgba(216,88,50,.15); outline: none; transform: translateY(-2px); }
    .notice-meta { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: #8b6e5d; font-size: .83rem; font-weight: 800; }
    .notice-kind { display: inline-flex; padding: 4px 9px; border: 1px solid #b6cde1; border-radius: 6px; background: #edf5fc; color: #245373; font-size: .8rem; font-weight: 800; line-height: 1.3; white-space: nowrap; }
    .notice-kind[data-category="event"] { color: #60398b; background: #f4edff; border-color: #ceb7e5; }
    .notice-kind[data-category="preview"] { color: #795016; background: #fff4d9; border-color: #dec28b; }
    #notice-category { margin-top: 8px; }
    #notice-category[hidden] { display: none; }
    .notice-card p { margin: 12px 0 0; font-size: 1.02rem; line-height: 1.55; white-space: pre-line; }
    #notice-detail[hidden], #notice-list[hidden], #notice-loading[hidden] { display: none; }
    .notice-loading { min-height: 180px; display: grid; place-content: center; gap: 12px; color: #8b6e5d; font-weight: 800; text-align: center; }
    .notice-spinner { width: 30px; height: 30px; margin-inline: auto; border: 3px solid #f1d9c0; border-top-color: #ea623c; border-radius: 50%; animation: spin .8s linear infinite; }
    #notice-detail time { display: block; margin: 20px 0 28px; color: #8b6e5d; font-weight: 700; }
    #notice-body { margin: 0; font-size: clamp(1.03rem, 2.5vw, 1.2rem); line-height: 1.85; white-space: pre-line; }
    .back { display: inline-flex; margin-top: 28px; border: 0; border-radius: 999px; background: #ea623c; color: white; padding: 13px 20px; font: inherit; font-weight: 900; text-decoration: none; cursor: pointer; }
    .error { color: #8b6e5d; }
    footer { padding: 0 0 36px; color: #8b6e5d; font-size: .84rem; }
    body.embedded { height: 100dvh; min-height: 0; overflow: hidden; background: #fff; }
    body.embedded header, body.embedded footer { display: none; }
    body.embedded main { width: 100%; height: 100%; padding: 8px; overflow: hidden; }
    body.embedded .notice-shell { height: 100%; border: 0; border-radius: 0; box-shadow: none; background: #fff; padding: 0; overflow: hidden; }
    body.embedded .kicker, body.embedded h1 { display: none; }
    body.embedded #notice-list, body.embedded #notice-detail { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    body.embedded #notice-list::-webkit-scrollbar, body.embedded #notice-detail::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body.embedded #notice-list { align-content: start; grid-auto-rows: max-content; gap: 8px; max-height: none; margin-top: 0; padding: 0 4px; }
    body.embedded .notice-card { padding: 10px 12px; border-radius: 12px; background: #fff; }
    body.embedded .notice-meta { font-size: .74rem; }
    body.embedded .notice-card p { display: -webkit-box; margin: 4px 0 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-size: .94rem; line-height: 1.35; }
    body.embedded #notice-detail { padding: 4px 4px 12px; }
    [hidden] { display: none !important; }
    .notice-empty { min-height: 180px; display: grid; place-content: center; margin: 0; padding: 24px 12px; color: #8b6e5d; font-weight: 800; line-height: 1.5; text-align: center; white-space: pre-line; }
    html.embedded header, html.embedded footer, html.embedded .kicker, html.embedded h1 { display: none; }
    html.embed-dark { color-scheme: dark; height: 100%; color: #fcfdfe; background: transparent; }
    html.embed-dark body, html.embed-dark body.embedded { height: 100%; color: #fcfdfe; background: transparent; }
    html.embed-dark body main { width: 100%; height: 100%; padding: 0; overflow: hidden; }
    html.embed-dark body .notice-shell { height: 100%; border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 0; overflow: hidden; animation: none; }
    html.embed-dark body #notice-list { padding: 0; gap: 12px; }
    html.embed-dark body .notice-card { border: 2px solid #00bfae; border-radius: 8px; background: #1a2130; color: #fcfdfe; padding: 12px 14px; box-shadow: none; }
    html.embed-dark body .notice-card:hover, html.embed-dark body .notice-card:focus-visible { border-color: #ffd21f; background: #262d3b; box-shadow: none; transform: none; }
    html.embed-dark body .notice-card:active { border-color: #007e75; background: #141c2a; }
    html.embed-dark body .notice-meta, html.embed-dark body #notice-detail time, html.embed-dark body .error { color: rgba(252, 253, 254, .64); }
    html.embed-dark body .notice-kind { border-color: rgba(70, 222, 208, .55); background: rgba(70, 222, 208, .12); color: #46ded0; }
    html.embed-dark body .notice-kind[data-category="event"] { border-color: rgba(201, 167, 255, .55); background: rgba(201, 167, 255, .12); color: #c9a7ff; }
    html.embed-dark body .notice-kind[data-category="preview"] { border-color: rgba(255, 210, 31, .55); background: rgba(255, 210, 31, .12); color: #ffd21f; }
    html.embed-dark body #notice-detail { padding: 4px 0 12px; }
    html.embed-dark body .back { border-radius: 8px; background: #00bfae; color: #101827; }
    html.embed-dark body .notice-empty { color: rgba(252, 253, 254, .72); }
    html.embed-dark body .notice-spinner { border-color: rgba(252, 253, 254, .18); border-top-color: #00bfae; }
    html.embed-dark body .notice-loading { color: rgba(252, 253, 254, .72); }
    html.embed-dark body .notice-link-preview { border-color: rgba(70, 222, 208, .45); background: #1a2130; color: #fcfdfe; }
    html.embed-dark body .notice-link-destination span, html.embed-dark body .notice-rich-content .notice-image-unavailable { color: rgba(252, 253, 254, .64); }
    html.embed-dark body .notice-rich-content hr, html.embed-dark body .notice-rich-content .notice-image-unavailable { border-color: rgba(252, 253, 254, .24); }
    @media (prefers-reduced-motion: no-preference) { .notice-shell { animation: enter .45s ease-out both; } @keyframes enter { from { opacity: 0; transform: translateY(10px); } } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">HOUSE DUCK</a>
    <label><span hidden>Language</span><select id="language" aria-label="Language"></select></label>
  </header>
  <main>
    <p class="kicker">QUIRKY BALL · UPDATE</p>
    <section class="notice-shell" aria-live="polite">
      <h1 id="notice-title">공지사항</h1>
      <div id="notice-loading" class="notice-loading">
        <span class="notice-spinner" aria-hidden="true"></span>
        <span id="notice-loading-text">Loading</span>
      </div>
      <div id="notice-list" aria-label="Notices"></div>
      <section id="notice-detail" hidden>
        <span id="notice-category" class="notice-kind"></span>
        <time id="notice-date"></time>
        <div id="notice-body"></div>
        <button id="back-to-list" class="back" type="button">← 공지 목록</button>
      </section>
    </section>
  </main>
  <footer>© 2026 House Duck. 작은 게임, 큰 개성.</footer>
  <script src="/assets/notice-links.js?v=20261007-hx"></script>
  <script src="content.js?v=20260909-1"></script>
  <script>
    const languageNames = { ko: "한국어", en: "English", de: "Deutsch", ja: "日本語", fr: "Français", es: "Español", it: "Italiano", zh_CN: "简体中文", zh_TW: "繁體中文", ar: "العربية", id: "Bahasa Indonesia", ur: "اردو" };
    const noticeLabels = {
      ko: { notice: "공지", back: "← 공지 목록", title: "공지사항", language: "언어", empty: "아직 등록된 공지사항이 없어요.", failed: "공지사항을 불러오지 못했어요." },
      en: { notice: "Notice", back: "← Notice list", title: "Notices", language: "Language", empty: "No announcements yet.", failed: "Could not load announcements." },
      de: { notice: "Hinweis", back: "← Zurück zur Liste", title: "Hinweise", language: "Sprache", empty: "Noch keine Ankündigungen.", failed: "Die Ankündigungen konnten nicht geladen werden." },
      ja: { notice: "お知らせ", back: "← お知らせ一覧", title: "お知らせ", language: "言語", empty: "お知らせはまだありません。", failed: "お知らせを読み込めませんでした。" },
      fr: { notice: "Avis", back: "← Liste des avis", title: "Avis", language: "Langue", empty: "Aucune annonce pour le moment.", failed: "Impossible de charger les annonces." },
      es: { notice: "Aviso", back: "← Lista de avisos", title: "Avisos", language: "Idioma", empty: "Aún no hay anuncios.", failed: "No se pudieron cargar los anuncios." },
      it: { notice: "Avviso", back: "← Elenco avvisi", title: "Avvisi", language: "Lingua", empty: "Nessun annuncio per ora.", failed: "Impossibile caricare gli avvisi." },
      zh_CN: { notice: "公告", back: "← 公告列表", title: "公告", language: "语言", empty: "暂无公告。", failed: "无法加载公告。" },
      zh_TW: { notice: "公告", back: "← 公告列表", title: "公告", language: "語言", empty: "暫無公告。", failed: "無法載入公告。" },
      ar: { notice: "إشعار", back: "← قائمة الإشعارات", title: "الإشعارات", language: "اللغة", empty: "لا توجد إعلانات بعد.", failed: "تعذر تحميل الإعلانات." },
      id: { notice: "Pengumuman", back: "← Daftar pengumuman", title: "Pengumuman", language: "Bahasa", empty: "Belum ada pengumuman.", failed: "Pengumuman tidak dapat dimuat." },
      ur: { notice: "اعلان", back: "← اعلانات کی فہرست", title: "اعلانات", language: "زبان", empty: "ابھی تک کوئی اعلانات نہیں ہیں۔", failed: "اعلانات لوڈ نہیں ہو سکیں۔" },
    };
    const categoryLabels = {
      ko: { event: "이벤트", preview: "예고" }, en: { event: "Event", preview: "Preview" },
      de: { event: "Event", preview: "Vorschau" }, ja: { event: "イベント", preview: "予告" },
      fr: { event: "Événement", preview: "À venir" }, es: { event: "Evento", preview: "Próximamente" },
      it: { event: "Evento", preview: "Anteprima" }, zh_CN: { event: "活动", preview: "预告" },
      zh_TW: { event: "活動", preview: "預告" }, ar: { event: "فعالية", preview: "قريبًا" },
      id: { event: "Acara", preview: "Segera" }, ur: { event: "ایونٹ", preview: "جلد آرہا ہے" },
    };
    const renderCategory = (element, category, locale) => {
      const value = ["notice", "event", "preview"].includes(category) ? category : "notice";
      element.dataset.category = value;
      element.textContent = `[${value === "notice" ? (noticeLabels[locale] ?? noticeLabels.en).notice : (categoryLabels[locale] ?? categoryLabels.en)[value]}]`;
      element.hidden = false;
    };
    const normalizeLanguage = (value) => ({ "zh-cn": "zh_CN", "zh-tw": "zh_TW", "zh-hans": "zh_CN", "zh-hant": "zh_TW" }[value.toLowerCase()] ?? value.split("-")[0]);
    const search = new URLSearchParams(location.search);
    const requestedParam = search.get("lang");
    const requested = requestedParam && requestedParam.trim() ? requestedParam : normalizeLanguage(navigator.language || "en");
    const selectedNoticeId = search.get("notice");
    if (search.has("embed")) document.body.classList.add("embedded");
    if (search.has("embed") && search.get("theme") === "dark") document.querySelector('meta[name="theme-color"]').content = "#101827";
    const endpoint = "https://bbgwvpwzkyudbtcgrbtm.supabase.co/functions/v1/public-notice";
    const language = languageNames[requested] ? requested : "en";

    const list = document.querySelector("#notice-list");
    const loading = document.querySelector("#notice-loading");
    const detail = document.querySelector("#notice-detail");
    const date = document.querySelector("#notice-date");
    const body = document.querySelector("#notice-body");
    const select = document.querySelector("#language");
    const loadingText = document.querySelector("#notice-loading-text");
    window.HouseDuckNoticeReady = false;
    let loadingDots = 1;
    let loadingTimer = null;
    for (const key of Object.keys(languageNames)) select.add(new Option(languageNames[key] ?? key, key));
    select.value = language;

    const renderLoading = () => {
      loadingText.textContent = `Loading${".".repeat(loadingDots)}`;
    };
    const startLoadingAnimation = () => {
      loadingDots = 1;
      renderLoading();
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = setInterval(() => {
        loadingDots = loadingDots % 3 + 1;
        renderLoading();
      }, 450);
    };
    const stopLoadingAnimation = () => {
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = null;
    };

    const renderChrome = (nextLanguage) => {
      const labels = noticeLabels[nextLanguage] ?? noticeLabels.en;
      document.documentElement.lang = nextLanguage;
      document.documentElement.dir = ["ar", "ur"].includes(nextLanguage) ? "rtl" : "ltr";
      select.setAttribute("aria-label", labels.language);
      document.querySelector("#notice-title").textContent = labels.title;
      document.querySelector("#back-to-list").textContent = labels.back;
      document.title = `${labels.title} — House Duck`;
    };
    const renderListMessage = (text, isError) => {
      const message = document.createElement("p");
      message.className = isError ? "notice-empty error" : "notice-empty";
      message.textContent = text;
      list.replaceChildren(message);
      loading.hidden = true;
      detail.hidden = true;
      list.hidden = false;
    };
    const renderDetail = (notice) => {
      document.querySelector("#back-to-list").hidden = false;
      date.hidden = false;
      renderCategory(document.querySelector("#notice-category"), notice.category, select.value);
      date.textContent = notice.created_at.slice(0, 10);
      date.dateTime = notice.created_at;
      body.className = "";
      if (window.HouseDuckNoticeContent) {
        window.HouseDuckNoticeContent.render(body, notice.content, notice.body);
      } else {
        body.textContent = notice.body;
      }
      list.hidden = true;
      loading.hidden = true;
      detail.hidden = false;
    };
    const loadNotices = async (nextLanguage) => {
	  window.HouseDuckNoticeReady = false;
      renderChrome(nextLanguage);
      startLoadingAnimation();
      loading.hidden = false;
      list.hidden = true;
      detail.hidden = true;
      try {
        const noticeEndpoint = new URL(endpoint);
        noticeEndpoint.searchParams.set("lang", nextLanguage);
        const response = await fetch(noticeEndpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("notice_unavailable");
        const data = await response.json();
        const notices = (Array.isArray(data.notices)
          ? data.notices.filter((notice) => notice?.body && notice?.created_at)
            .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())
          : []);
        if (!notices.length) {
          // An empty console table is a normal state: show the list's empty state, not an error detail.
          stopLoadingAnimation();
          renderListMessage((noticeLabels[nextLanguage] ?? noticeLabels.en).empty, false);
          return;
        }
        list.replaceChildren(...notices.map((notice) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "notice-card";
            const meta = document.createElement("span");
            meta.className = "notice-meta";
            const kind = document.createElement("span");
            kind.className = "notice-kind";
            renderCategory(kind, notice.category, nextLanguage);
            const created = document.createElement("time");
            created.dateTime = notice.created_at;
            created.textContent = notice.created_at.slice(0, 10);
            meta.append(kind, created);
            const preview = document.createElement("p");
            preview.textContent = notice.body;
            card.append(meta, preview);
            card.addEventListener("click", () => renderDetail(notice));
            return card;
          }));
        stopLoadingAnimation();
        loading.hidden = true;
        list.hidden = false;
        const selected = notices.find((notice) => String(notice.id) === selectedNoticeId);
        if (selected) renderDetail(selected);
      } catch (_error) {
        stopLoadingAnimation();
        // Failure stays on the list page (no detail view, no back button to an empty list).
        renderListMessage((noticeLabels[nextLanguage] ?? noticeLabels.en).failed, true);
      } finally {
        window.HouseDuckNoticeReady = true;
      }
    };
    select.addEventListener("change", () => {
      const url = new URL(location.href);
      url.searchParams.set("lang", select.value);
      location.replace(url);
    });
    document.querySelector("#back-to-list").addEventListener("click", () => {
      detail.hidden = true;
      list.hidden = false;
    });
    loadNotices(language);
  </script>
</body>
</html>
