name: Public site security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Check public repository contents
        run: bash scripts/check_public_repo.sh --all
      - name: Test public site
        run: |
          bash scripts/check_brand_site.sh
          node scripts/test_compact_visual_system.js
          node scripts/test_site_refinement.js
          node scripts/test_community_stats.js
          node scripts/test_studio_music.js
          node scripts/test_public_ui_regressions.js
          node scripts/test_site_links.js
          node scripts/test_deployment_workflows.js
          node scripts/test_blog_retirement.js
      - name: Test legal site
        run: |
          bash scripts/check_legal_site.sh
          bash scripts/check_policy_content.sh
          node scripts/test_legal_site.js
          node scripts/test_legal_status_regressions.js
      - name: Test House Duck console
        run: |
          bash scripts/check_house_duck_console.sh
          bash scripts/check_analytics_dashboard.sh
          node scripts/test_console_model.js
          node scripts/test_purchases_model.js
          node scripts/test_gmail_model.js
          node scripts/test_cs_intelligence.js
          node scripts/test_pulse_model.js
          node scripts/test_console_regressions.js
