name: Public site security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public repository contents
        run: bash scripts/check_public_repo.sh --all
      - name: Check House Duck console
        run: bash scripts/check_house_duck_console.sh
      - name: Check analytics dashboard
        run: bash scripts/check_analytics_dashboard.sh
      - name: Test console models
        run: |
          node scripts/test_console_model.js
          node scripts/test_gmail_model.js
          node scripts/test_pulse_model.js
