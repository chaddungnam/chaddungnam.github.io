name: Sync House Duck blog

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-house-duck-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Tistory RSS once
        run: |
          mkdir -p .tmp
          curl --fail --silent --show-error --location https://houseduck.tistory.com/rss --output .tmp/rss.xml
          node scripts/blog-sync.mjs --rss .tmp/rss.xml --out-root . --source-out .tmp/blog-source.json --translations assets/blog-translations.json
      - name: Translate changed posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/translate_blog.py --input .tmp/blog-source.json --output assets/blog-translations.json
      - name: Render validated translations
        run: node scripts/blog-sync.mjs --rss .tmp/rss.xml --out-root . --translations assets/blog-translations.json
      - name: Verify generated blog
        run: |
          node scripts/test_blog_sync.mjs
          python scripts/test_translate_blog.py
          python scripts/test_blog_translation_regressions.py
          node scripts/test_blog_mirror.js
          npm run test:blog-security
      - name: Publish changed posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blog-feed.json assets/blog-locales.js assets/blog-translations.json blog sitemap-blog.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): sync Tistory posts"
          git push
      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for delay in 0 10 20; do
            sleep "$delay"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              exit 0
            fi
          done
          exit 1
