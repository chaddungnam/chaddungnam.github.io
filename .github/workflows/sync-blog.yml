name: Sync House Duck blog

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-house-duck-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-ko-en-de-ja-v1
      - name: Install offline translator
        run: python -m pip install argostranslate==1.11.0
      - name: Fetch, translate, and render posts
        run: |
          mkdir -p .tmp
          node scripts/blog-sync.mjs --rss-url https://houseduck.tistory.com/rss --out-root . --source-out .tmp/blog-source.json --translations assets/blog-translations.json
          python scripts/translate_blog.py --input .tmp/blog-source.json --output assets/blog-translations.json
          node scripts/blog-sync.mjs --rss-url https://houseduck.tistory.com/rss --out-root . --translations assets/blog-translations.json
      - name: Verify generated blog
        run: |
          node scripts/test_blog_sync.mjs
          python scripts/test_translate_blog.py
      - name: Publish changed posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blog-feed.json assets/blog-translations.json blog sitemap-blog.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): sync Tistory posts"
          git push
