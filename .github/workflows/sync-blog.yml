name: Sync House Duck blog

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-house-duck-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch Tistory RSS once
        run: |
          mkdir -p .tmp
          curl --fail --silent --show-error --location https://houseduck.tistory.com/rss --output .tmp/rss.xml
          node scripts/blog-sync.mjs --rss .tmp/rss.xml --out-root . --source-out .tmp/blog-source.json --translations assets/blog-translations.json
      - name: Publish Korean posts
        id: publish-korean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blog-feed.json assets/blog-locales.js assets/blog-translations.json blog sitemap-blog.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(blog): sync Korean Tistory posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger GitHub Pages build (Korean posts)
        if: steps.publish-korean.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          triggered=false
          for delay in 0 10 20; do
            sleep "$delay"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              triggered=true
              break
            fi
          done
          test "$triggered" = true || exit 1
          for attempt in $(seq 1 30); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq .status)
            case "$status" in
              built) exit 0 ;;
              errored) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Notify IndexNow (Korean posts)
        if: steps.publish-korean.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git diff-tree --no-commit-id --name-only -r -z HEAD | node scripts/indexnow-payload.mjs > .tmp/indexnow.json
          if test -s .tmp/indexnow.json; then
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @.tmp/indexnow.json \
              https://api.indexnow.org/indexnow
          fi
      - name: Translate changed posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/translate_blog.py --input .tmp/blog-source.json --output assets/blog-translations.json
      - name: Render validated translations
        run: node scripts/blog-sync.mjs --rss .tmp/rss.xml --out-root . --translations assets/blog-translations.json
      - name: Verify generated blog
        run: |
          node scripts/test_blog_sync.mjs
          python scripts/test_translate_blog.py
          python scripts/test_blog_translation_regressions.py
          node scripts/test_blog_mirror.js
          npm run test:blog-security
      - name: Publish translated posts
        id: publish-translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blog-feed.json assets/blog-locales.js assets/blog-translations.json blog sitemap-blog.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(blog): sync Tistory posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger GitHub Pages build (translations)
        if: steps.publish-translations.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          triggered=false
          for delay in 0 10 20; do
            sleep "$delay"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              triggered=true
              break
            fi
          done
          test "$triggered" = true || exit 1
          for attempt in $(seq 1 30); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq .status)
            case "$status" in
              built) exit 0 ;;
              errored) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Notify IndexNow (translations)
        if: steps.publish-translations.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git diff-tree --no-commit-id --name-only -r -z HEAD | node scripts/indexnow-payload.mjs > .tmp/indexnow.json
          if test -s .tmp/indexnow.json; then
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @.tmp/indexnow.json \
              https://api.indexnow.org/indexnow
          fi
