<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Duck - Indie Game Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif;
            background: #F5F2EC;
            color: #1C1C1E;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; padding: 60px 0 40px; }
        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #1C1C1E;
            margin-bottom: 10px;
        }
        .tagline { color: #6b675f; font-size: 1.1rem; }
        .games-section { margin-top: 60px; }
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.5rem;
            color: #1C1C1E;
            margin-bottom: 30px;
            text-align: center;
        }
        .game-card {
            background: #ffffff;
            border: 1px solid #e3ded3;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(28, 28, 30, 0.08); }
        .game-icon {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            flex-shrink: 0;
            display: block;
        }
        .game-info h3 {
            font-size: 1.4rem;
            color: #1C1C1E;
            margin-bottom: 8px;
        }
        .game-info h3 .ko {
            font-family: 'Do Hyeon', 'Noto Sans KR', sans-serif;
            font-weight: 400;
        }
        .game-info h3 .en {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }
        .game-info p { color: #6b675f; margin-bottom: 15px; }
        .game-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            background: #f0ece2;
            color: #b06823;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            padding: 60px 20px 40px;
            color: #6b675f;
            font-size: 0.9rem;
        }
        a { color: #b06823; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .game-card { flex-direction: column; text-align: center; }
            .logo { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🦆 House Duck</div>
            <p class="tagline">작지만 재미있는 게임을 만드는 인디 게임 스튜디오</p>
        </header>

        <section class="games-section">
            <h2 class="section-title">🎮 Our Games</h2>

            <a href="quirky-ball/" style="text-decoration: none; color: inherit;">
                <div class="game-card">
                    <img class="game-icon" src="quirky-ball/app-icon.png" alt="쿼키볼 앱 아이콘">
                    <div class="game-info">
                        <h3><span class="ko">쿼키볼</span> <span class="en">(Quirky Ball)</span></h3>
                        <p>당신의 두뇌를 움직이게 할 중독성 퍼즐 게임!</p>
                        <div class="game-tags">
                            <span class="tag">Puzzle</span>
                            <span class="tag">Android</span>
                            <span class="tag">Casual</span>
                        </div>
                    </div>
                </div>
            </a>
        </section>
    </div>

    <footer>
        <p>© 2026 House Duck. All rights reserved.</p>
        <p style="margin-top: 10px;">
            <a href="terms/ko.html">이용약관</a> ·
            <a href="privacy/ko.html">개인정보처리방침</a> ·
            <a href="support/">고객지원</a>
        </p>
    </footer>
</body>
</html>
